name: Soft skills web MVP
on:
  push:
    paths: ['web/soft-skills/**', '.github/workflows/soft-skills-web.yml']
  pull_request:
    paths: ['web/soft-skills/**', '.github/workflows/soft-skills-web.yml']
permissions:
  contents: read
jobs:
  data-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/soft-skills/scripts/build-data.mjs
      - run: git diff --exit-code -- web/soft-skills/data/skills.json
      - run: node --test web/soft-skills/tests/*.test.mjs
      - run: node --check web/soft-skills/app.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/skills-browser --no-save playwright@1.62.1
          /tmp/skills-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser scenarios
        env:
          NODE_PATH: /tmp/skills-browser/node_modules
          SCREENSHOT_DIR: /tmp/skills-screenshots
        run: |
          python3 -m http.server 8080 --directory web/soft-skills > /tmp/skills-server.log 2>&1 &
          node web/soft-skills/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soft-skills-browser-screenshots
          path: /tmp/skills-screenshots
          if-no-files-found: ignore
