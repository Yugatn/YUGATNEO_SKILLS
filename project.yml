name: YugatnNeoSkills
options:
  bundleIdPrefix: org.yugatn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  YugatnNeoSkills:
    type: application
    platform: iOS
    sources:
      - path: Sources/YugatnNeoSkills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yugatn.YugatnNeoSkills
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Для отображения пульса во время тренировки, только с вашего разрешения."
        INFOPLIST_KEY_NSCameraUsageDescription: "Для локального анализа положения тела во время выбранной тренировки."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: config/YugatnNeoSkills.entitlements
